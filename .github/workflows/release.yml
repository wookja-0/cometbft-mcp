name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub release
      packages: write      # ghcr.io image
      id-token: write      # provenance attestations and MCP Registry OIDC login
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cometbft-mcp
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check versions agree
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version server.json)" = "$v"
          test "$(jq -r '.packages[0].identifier' server.json)" = "$IMAGE:$v"

      - run: make lint
      - run: go test -race ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              name="cometbft-mcp_${v}_${os}_${arch}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$v" -o "dist/$name/cometbft-mcp" ./cmd/cometbft-mcp
              cp LICENSE README.md "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz


      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$v" \
            --tag "$IMAGE:$v" --tag "$IMAGE:latest" \
            --metadata-file meta.json --push .
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # After the image so a failed push does not leave a release without one;
      # idempotent so the workflow can be re-run after a later failure.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
