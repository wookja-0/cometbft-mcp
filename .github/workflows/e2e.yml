name: e2e

# The localnet suite waits on real chain time (a jail period, a governance
# vote, a halt), so it takes ~5 minutes and runs daily, on demand, and on
# pull requests labeled `e2e` rather than on every push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Building simd from the Cosmos SDK source takes minutes; cache the
      # image, keyed on its Dockerfile.
      - name: Cache simd image
        id: simd
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/simd-image.tar
          key: simd-${{ hashFiles('localnet/Dockerfile') }}
      - if: steps.simd.outputs.cache-hit == 'true'
        run: docker load -i /tmp/simd-image.tar
      - if: steps.simd.outputs.cache-hit != 'true'
        run: make localnet-image && docker save "$(make -s simd-image-name)" -o /tmp/simd-image.tar

      - run: make localnet-up
      - run: make e2e
      - if: always()
        run: make localnet-down
